name: C/C++ CI

on:
  push:
    branches: [ "v3.6.x_plus" ]
  pull_request:
    branches: [ "v3.6.x_plus" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: msbuild Source\uacme.sln /m /v:normal /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143   
