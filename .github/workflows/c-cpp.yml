name: C/C++ CI

on:
  push:
    branches: [ "v3.6.x_plus" ]
  pull_request:
    branches: [ "v3.6.x_plus" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-autotools mingw-w64-ucrt-x86_64-gcc
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck  
